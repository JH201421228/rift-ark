# RIFT ARK / 균열의 방주 — Codemagic CI
#
# ★ **완전 CI/CD 를 구축한다** (2026-08-08 사용자 결정). Android 와 iOS 를 둘 다
#   Codemagic 으로 한다 — 사용자에게 맥이 없고, Codemagic 은 App Store Connect
#   API 키만으로 애플 인증서를 만들고 갱신해 준다.
#
#   ⏸ **iOS 워크플로는 아직 없다.** 준비물(Apple Developer · ASC API 키 ·
#     PrivacyInfo.xcprivacy · iOS 광고 단위 ID)이 빠져 있어 **돌 수 없는 워크플로**가
#     되기 때문이다. 목록은 `50 §9.7`.
#
#   ★★ 첫 실행에서 가장 먼저 확인할 것: 아래 첫 스텝이 검사하는 `CM_*` 네 이름은
#     **Codemagic 문서 기준이고 한 번도 실측된 적이 없다.** 첫 실행이 1분 안에
#     실패하면서 실제 이름 목록을 출력하도록 만들어 두었다 — 그 목록을 보고
#     `FE/android/app/build.gradle` 을 맞춘다.
#
# 절차 문서: docs/06-release/50-google-play-paid-codemagic.md §9
#   §9.2 키스토어 등록 (reference name: riftark_keystore)
#   §9.3 서비스 계정 JSON 등록 (변수 그룹: google_play)
#
# ★ 워크플로는 둘이다. 하나는 검증만, 하나는 릴리스다.
#   dev 는 통합 브랜치라 자주 깨질 수 있으므로 Play 에 올리지 않는다 (§1.1).

definitions:
  # ─────────────────────────────────────────────────────────────────
  # ★★★ 이 저장소에서 순서가 틀리면 조용히 실패하는 자리 (실측 2026-08-08 · §1.1)
  #
  #   Gradle 은 `npx cap sync android` **뒤에만** 돈다. 클론 직후 ./gradlew 를
  #   바로 부르면 설정 단계에서 죽는데, 메시지는 cordova.variables.gradle 이
  #   없다고만 말하고 "cap sync" 라는 말이 한 번도 나오지 않는다. 그 파일은
  #   cap sync 가 생성하고 .gitignore 대상이다.
  #
  #   → 그래서 웹 빌드 · 동기화가 **반드시** Gradle 앞에 온다.
  # ─────────────────────────────────────────────────────────────────
  scripts:
    - &install
      name: 의존성 설치
      script: |
        cd FE
        npm ci

    - &gates
      name: 검증 게이트 (lint · test · data · check · icons)
      script: |
        cd FE
        npm run lint
        npm run test
        npm run data:validate
        npm run check
        npm run icons:check

    - &webbuild
      name: 웹 빌드 + Capacitor 동기화
      # ★ `prebuild` 가 assets:all(아틀라스 · 오디오)을 자동으로 돌린다.
      #   여기서 assets:all 을 따로 부르면 **두 번** 돌아간다 — 부르지 않는다.
      script: |
        cd FE
        npm run build
        npx cap sync android

    - &prodcheck
      name: 프로덕션 잔재 점검
      # ★ `npm run check:prod` 를 쓰지 않는다 — 그 스크립트는 `vite build` 를
      #   한 번 더 돌린다. 방금 만든 dist 를 그대로 검사한다.
      script: |
        cd FE
        node tools/check-production.mjs

environment: &base_env
  node: 22
  java: 21          # ★ 21 미만이면 "invalid source release: 21"

workflows:
  # ═══════════════════════════════════════════════════════════════════
  # ① 검증 — dev · PR. Play 에 아무것도 올리지 않는다.
  # ═══════════════════════════════════════════════════════════════════
  android-verify:
    name: RIFT ARK — 검증 (배포 없음)
    # ★ linux_x2 는 과금 계정에서만 열린다. 무료 요금제 포함 빌드 시간(월 500분)은
    #   Mac mini M2 에서만 제공되므로, Android 빌드라도 무료 티어에서는 이 값을 쓴다.
    #   (2026-08-08, "The selected instance type is not available with the
    #    current billing plan." 에러로 확인)
    instance_type: mac_mini_m2
    max_build_duration: 45

    environment:
      <<: *base_env

    # ★★★ main 은 트리거하지 않는다 (2026-08-08).
    #   작업 흐름이 항상 dev → stage → main 순으로 승격하므로, main 에 push 되는
    #   커밋은 몇 분 전 dev 에서 이미 검증 빌드를 한 번 태운 **같은 내용**이다.
    #   dev 와 main 둘 다 걸어 두면 매 릴리스 준비마다 검증 빌드가 정확히
    #   두 배로 돈다 — 무료 요금제 월 500분을 반으로 깎아 먹는 실낭비였다
    #   (실측: 이 저장소의 dev→stage→main 승격 5회에서 검증 빌드 10개,
    #    같은 코드를 다섯 번 두 번씩 검사한 셈).
    #   ⚠ main 에 dev 를 거치지 않는 직접 핫픽스가 생기면 이 가드가 없다 —
    #     그런 워크플로로 바뀌면 main 을 다시 넣는다.
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: 'dev'
          include: true

    scripts:
      - *install
      - *gates
      - *webbuild
      - *prodcheck

      # ★ 서명 없이 AAB 가 만들어지는가 — §1.3 의 canSignRelease 가드 검증.
      #   키가 없는 환경에서 설정 단계가 죽지 않아야 한다.
      - name: AAB 빌드 (서명 없음 — 가드 검증)
        script: |
          cd FE/android
          chmod +x gradlew
          ./gradlew bundleRelease

    artifacts:
      - FE/android/app/build/outputs/bundle/**/*.aab

    publishing:
      email:
        recipients:
          - 741u741@gmail.com
        notify:
          success: false
          failure: true

  # ═══════════════════════════════════════════════════════════════════
  # ② 릴리스 — 태그(v*)를 밀 때만. Play 내부 테스트 트랙으로 올라간다.
  # ═══════════════════════════════════════════════════════════════════
  android-release:
    name: RIFT ARK — Android Release
    # ★ 위 android-verify 와 같은 이유로 mac_mini_m2 (무료 요금제에서 열리는 값).
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      <<: *base_env
      android_signing:
        - riftark_keystore        # §9.2 의 reference name
      groups:
        - google_play             # §9.3 의 변수 그룹
      vars:
        PACKAGE_NAME: "com.superdimension.app"
        # ★★★ CI 의 versionCode 오프셋 (2026-08-08).
        #
        #   Codemagic 의 BUILD_NUMBER 는 그 앱의 **첫 빌드에서 1부터** 시작한다.
        #   그런데 손으로 올리면서 versionCode 1·2 를 이미 태웠고, 한 번 쓴 값은
        #   영원히 재사용할 수 없다 — 그대로 두면 **CI 첫 빌드가 거부된다**
        #   ("1 버전 코드는 이미 사용되었습니다", 실제로 겪음).
        #
        #   CI 는 1001 부터, 로컬 수동 빌드는 1000 미만을 쓴다. 두 공간이 겹치지 않아
        #   어느 쪽을 몇 번 돌려도 충돌하지 않는다.
        #
        #   ★ 이 값을 Codemagic 콘솔의 "빌드 번호 시작값" 으로 대신하지 않는다 —
        #     콘솔 설정은 저장소를 아무리 봐도 알 수 없고, 앱을 다시 만들면 조용히
        #     1 로 돌아간다. 여기 있으면 코드 리뷰에 보인다.
        VERSION_CODE_BASE: "1000"

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true

    scripts:
      # ───────────────────────────────────────────────────────────────
      # ★★★ 첫 실행에서 가장 먼저 알아야 하는 것을 가장 먼저 검사한다.
      #
      #   FE/android/app/build.gradle 은 CI 자격증명을 CM_KEYSTORE_PATH ·
      #   CM_KEYSTORE_PASSWORD · CM_KEY_ALIAS · CM_KEY_PASSWORD 에서 읽는다 (§1.3).
      #
      #   이 이름들이 Codemagic 이 실제로 내보내는 이름과 다르면 —
      #   `canSignRelease` 가 false 로 떨어져 **서명 없는 AAB 가 만들어지고
      #   빌드는 BUILD SUCCESSFUL 로 끝난다.** 그리고 Play 업로드 단계에서야
      #   거부된다. 정확히 §1.4 가 경고하는 조용한 실패다.
      #
      #   ⚠ 이름은 Codemagic 문서 기준이고 **첫 실행 전까지 실측된 적이 없다.**
      #     그래서 틀렸을 때 무엇이 실제로 있는지 출력하고 즉시 멈춘다.
      # ───────────────────────────────────────────────────────────────
      - name: ★ 서명 환경변수 확인 — 없으면 여기서 멈춘다
        script: |
          missing=""
          for v in CM_KEYSTORE_PATH CM_KEYSTORE_PASSWORD CM_KEY_ALIAS CM_KEY_PASSWORD; do
            eval "val=\${$v:-}"
            if [ -z "$val" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "════════════════════════════════════════════════════════"
            echo "서명 환경변수가 없다:$missing"
            echo ""
            echo "이 빌드에서 실제로 설정된 CM_* 변수 이름 (값은 출력하지 않는다):"
            env | sed -n 's/^\(CM_[A-Z0-9_]*\)=.*/  \1/p' | sort
            echo ""
            echo "→ docs/06-release/50-google-play-paid-codemagic.md §1.3 · §9.2"
            echo "  build.gradle 이 읽는 이름과 위 목록을 맞춘다."
            echo "════════════════════════════════════════════════════════"
            exit 1
          fi
          echo "서명 환경변수 4개 확인됨 (값은 출력하지 않는다)."
          if [ ! -f "$CM_KEYSTORE_PATH" ]; then
            echo "CM_KEYSTORE_PATH 가 가리키는 파일이 없다: $CM_KEYSTORE_PATH"
            exit 1
          fi

      - *install
      - *gates
      - *webbuild
      - *prodcheck

      - name: AAB 빌드
        script: |
          cd FE/android
          chmod +x gradlew
          ./gradlew bundleRelease

      # ───────────────────────────────────────────────────────────────
      # ★★★ BUILD SUCCESSFUL 은 "올바른 키로 서명됐다"를 뜻하지 않는다 (§1.4).
      #   `:app:signReleaseBundle` 은 키가 없어도 태스크 목록에 나타난다.
      #   Play 가 거부해서 알게 되는 것보다 여기서 실패하는 편이 낫다.
      # ───────────────────────────────────────────────────────────────
      - name: ★ AAB 가 정말 서명됐는가 · versionCode 가 맞는가
        script: |
          set -e
          OUTDIR=FE/android/app/build/outputs/bundle/release
          AAB=$(ls "$OUTDIR"/*.aab 2>/dev/null | head -1)

          # ★ "파일이 없다" 와 "서명이 없다" 를 같은 메시지로 말하지 않는다.
          #   `ls | head` 는 ls 가 실패해도 파이프라인 종료 코드가 0 이라
          #   set -e 가 잡지 못한다 — 여기서 명시적으로 막는다.
          if [ -z "$AAB" ] || [ ! -f "$AAB" ]; then
            echo "✗ AAB 가 만들어지지 않았다. 앞의 'AAB 빌드' 스텝을 본다."
            echo "  찾은 곳: $OUTDIR"
            ls -la "$OUTDIR" 2>&1 || echo "  (디렉터리 자체가 없다)"
            exit 1
          fi
          echo "AAB: $AAB  ($(stat -c%s "$AAB") 바이트)"

          jarsigner -verify -verbose:summary -certs "$AAB" > sigcheck.txt 2>&1 || true
          grep -E 'X\.509|jar verified|jar is unsigned' sigcheck.txt || true

          if ! grep -q "jar verified" sigcheck.txt; then
            echo "✗ 서명되지 않았다. build.gradle 의 canSignRelease 가 false 로 떨어졌다 (§1.3)."
            exit 1
          fi
          if grep -q "CN=Unknown" sigcheck.txt; then
            echo "✗ 인증서 주체가 CN=Unknown 이다 — keytool 에 -dname 이 빠진 키다 (§1.2)."
            exit 1
          fi

          MANIFEST=FE/android/app/build/intermediates/merged_manifest/release/processReleaseMainManifest/AndroidManifest.xml
          VC=$(grep -o 'android:versionCode="[^"]*"' "$MANIFEST" | head -1 | grep -o '[0-9]\+')
          WANT=$((${VERSION_CODE_BASE:-0} + BUILD_NUMBER))
          echo "versionCode=$VC  (VERSION_CODE_BASE=${VERSION_CODE_BASE:-0} + BUILD_NUMBER=$BUILD_NUMBER = $WANT)"
          if [ "$VC" != "$WANT" ]; then
            echo "✗ versionCode 가 기대값과 다르다 — build.gradle 이 VERSION_CODE_BASE 를 읽지 못했다 (§1.3)."
            exit 1
          fi
          # ★ 오프셋이 조용히 0 으로 떨어지면 CI 가 손으로 태운 1·2 와 충돌한다.
          #   그때 나오는 것은 빌드 실패가 아니라 **업로드 거부**이고, 그건 한참 뒤다.
          if [ "$VC" -le 1000 ]; then
            echo "✗ versionCode 가 $VC 다 — CI 는 1000 을 넘겨야 한다."
            echo "  VERSION_CODE_BASE 가 환경에 전달되지 않았다. codemagic.yaml 의 vars 를 확인하라."
            exit 1
          fi

          # ★ 광고 ID 권한은 play-services-ads 가 자동 주입한다 (§4.6 · 실측 §1.4).
          #   사라졌다면 광고 SDK 배선이 빠진 것이고, Play 광고 ID 선언과 어긋난다.
          if grep -q 'com.google.android.gms.permission.AD_ID' "$MANIFEST"; then
            echo "AD_ID 권한 있음 — Play 광고 ID 선언 '예' 와 일치한다 (§4.6)."
          else
            echo "⚠ AD_ID 권한이 없다. 광고를 켠 릴리스라면 Play 선언과 어긋난다 (§4.6)."
          fi

    artifacts:
      - FE/android/app/build/outputs/bundle/**/*.aab
      - sigcheck.txt

    publishing:
      email:
        recipients:
          - 741u741@gmail.com
        notify:
          success: true
          failure: true

      # ⚠ 첫 업로드는 이것이 하지 못한다 — §6.3.
      #   Play Publishing API 는 "릴리스가 하나도 없는 앱"에 올릴 수 없다.
      #   AAB 를 손으로 한 번 올린 뒤부터 이 절이 동작한다.
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        # ★ 2026-08-08: internal(내부 테스트) → alpha(비공개 테스트) 로 변경.
        #   Play Developer API 에서 "비공개 테스트" 의 기본 트랙 식별자는
        #   레거시 이름인 alpha 다 (Play Console UI 표기와 다르다).
        #   ⚠ Play Console 에서 커스텀 이름의 클로즈드 트랙을 별도로 만든 적이
        #     있다면 그 트랙명으로 바꿔야 한다 — Console → 테스트 → 비공개 테스트
        #     화면에서 실제 트랙 이름을 확인할 것.
        track: alpha               # internal → alpha(비공개) → production (§9.5)
        submit_as_draft: false

  # ═══════════════════════════════════════════════════════════════════
  # ③ iOS 릴리스 — Android 와 같은 태그(v*)를 밀 때 함께 돈다. TestFlight 로 올라간다.
  # ═══════════════════════════════════════════════════════════════════
  #
  # ★★★ 사전 준비물 전부 확인됨 (2026-08-08):
  #   Apple Developer Program 가입 완료
  #   App Store Connect 앱 등록 완료 (Bundle ID com.superdimension.app,
  #     App Store Connect App ID 6799441695)
  #   App Store Connect API 키 — 기존에 다른 앱으로 이미 Codemagic 에 등록된
  #     키를 재사용한다. API 키는 Apple Developer 팀(계정) 단위로 발급되고
  #     Codemagic 등록도 팀 단위라, 같은 Apple 계정·같은 Codemagic 계정이면
  #     앱마다 새로 만들 필요가 없다 (사용자 확인 2026-08-08).
  #   PrivacyInfo.xcprivacy 작성 완료 (트래킹 도메인은 TODO — 파일 주석 참조)
  #   ATT(App Tracking Transparency) 요청 로직 구현 완료 (native/ads.js)
  #   AdMob iOS 앱 ID·광고 단위 ID 반영 완료
  #   ★ 공유(shared) Xcode scheme 신규 작성 — 이 프로젝트가 한 번도 Xcode 로
  #     열린 적이 없어서 xcshareddata/xcschemes/App.xcscheme 가 아예 없었다.
  #     Codemagic 은 git 클론만으로 빌드하므로 로컬에서 생성됐을 개인용
  #     scheme(xcuserdata, .gitignore 대상)은 안 보인다 — 공유로 커밋해 두지
  #     않으면 `xcodebuild -scheme App` 이 "scheme 을 찾을 수 없다"로 실패한다.
  ios-release:
    name: RIFT ARK — iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 90

    integrations:
      # ★ 2026-08-08 사용자 확인. Codemagic → Team settings → Team integrations
      #   → Developer Portal → Manage keys 에 등록된 실제 key name 이다.
      #   ⚠ 이름이 "eatlog_..." 인 것은 **오타가 아니다** — 이 프로젝트(RIFT ARK)
      #     때문에 새로 만든 키가 아니라, 다른 앱("eatlog") 작업 때 이미 만들어
      #     Codemagic 에 등록해 둔 키를 그대로 재사용한다. App Store Connect
      #     API 키는 앱 하나가 아니라 **Apple Developer 팀(계정) 전체**에
      #     App Manager 권한으로 걸리고, Codemagic 등록도 팀 단위라, 같은
      #     Apple 계정·같은 Codemagic 계정이면 앱마다 새로 만들 필요가 없다
      #     (사용자 확인 — 두 조건 모두 이 프로젝트와 같은 계정임).
      #   ⚠ 이름이 안 맞으면 빌드 스텝이 아니라 **설정 해석 단계**에서
      #     "integration not found" 로 막힌다 — Android 서명 변수처럼 "실제
      #     이름을 출력하고 멈추는" 방어 스크립트를 짤 수조차 없는 자리라,
      #     이 값은 반드시 사람이 직접 확인해서 채워 넣어야 했다.
      app_store_connect: "eatlog_app_store_connect"

    environment:
      <<: *base_env
      # ★★★ 2026-08-09 자동 서명(distribution_type + bundle_identifier)에서
      #   수동 서명(참조 이름)으로 바꿨다 — 첫 태그 트리거(v1.0.3)가 App ID·
      #   인증서·프로파일이 전부 Apple 쪽에 정상 존재하는데도 "No matching
      #   profiles found" 로 7연속 즉시 실패했다. Codemagic 자체의
      #   "Fetch profiles" UI(같은 API 키)는 그 프로파일을 정상적으로
      #   보고 있었는데도 빌드 시점 자동 서명만 못 찾았다 — 즉 자동 서명은
      #   "Apple 에 프로파일이 있는가"가 아니라 **Codemagic 이 그 프로파일에
      #   물린 인증서의 개인키를 직접 보관하고 있는가**까지 봤다.
      #   기존 인증서(JuHeon Park Distribution, eatlog 작업 때 API 로 생성)는
      #   Apple 쪽엔 있었지만 Codemagic 자체 저장소엔 없었다("Code signing
      #   certificates: No certificates shared with the team").
      #   → Team settings → Code signing identities 에서 인증서를 새로
      #   **생성**(`riftark_distribution` — 이러면 개인키를 Codemagic 이 직접
      #   보관한다)하고, 그 인증서로 새 App Store 프로파일(`RIFT ARK App Store
      #   CM`)을 Apple 포털에서 만든 뒤 `riftark_appstore_profile` 로 fetch 했다.
      #   같은 실수를 반복하지 않으려면: 이 계정에서 App Store Connect API 로
      #   생성된 인증서라도 **Codemagic 자체 저장소에 있는 것만 자동/수동
      #   서명에 실제로 쓸 수 있다** — Apple 포털에 보인다고 쓸 수 있는 게 아니다.
      ios_signing:
        certificates:
          - certificate: riftark_distribution
        provisioning_profiles:
          - profile: riftark_appstore_profile
      vars:
        # ★ get-latest-app-store-build-number 가 어느 앱을 볼지 알려주는 값.
        #   App Store Connect → App Information → Apple ID (2026-08-08 확인).
        APP_STORE_APPLE_ID: "6799441695"
        # ★ 2026-08-09: "ios/App/App.xcworkspace"였는데 IPA 빌드 스텝이 이미
        #   `cd $CM_BUILD_DIR/FE/ios/App` 를 하고 나서 이 값을 --workspace 로
        #   넘긴다 — 그래서 실제로 찾던 경로는
        #   FE/ios/App/ios/App/App.xcworkspace(중복)였고 당연히 없었다.
        #   ("Path does not exist" 로 즉시 실패 · exit code 2)
        XCODE_WORKSPACE: "App.xcworkspace"
        XCODE_SCHEME: "App"

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true

    scripts:
      - *install
      - *gates

      # ★★★ `&webbuild` 앵커를 쓰지 않는다 — 그 앵커는 `npx cap sync android`
      #   를 **명시적으로** 부른다(위 android 워크플로들 참조). 그대로 재사용하면
      #   iOS 네이티브 프로젝트에는 아무것도 동기화되지 않은 채 그다음 pod
      #   install·xcodebuild 가 옛 웹 빌드(또는 아무것도 없는 상태)로 진행된다 —
      #   실패하지 않고 **낡은 콘텐츠로 조용히 성공**할 수 있어 더 위험하다.
      - name: 웹 빌드 + Capacitor 동기화 (iOS)
        # ★ `prebuild` 가 assets:all 을 자동으로 돌린다 — 여기서 또 부르지 않는다.
        script: |
          cd FE
          npm run build
          npx cap sync ios

      - name: CocoaPods 설치
        # ★ cap sync 가 Podfile 을 갱신할 수 있으므로 그 **뒤**에 돈다.
        script: |
          cd FE/ios/App
          pod install

      - name: Xcode 코드 서명 설정 적용
        # ★ integrations.app_store_connect 로 등록한 키를 이용해 Codemagic 이
        #   인증서·프로비저닝 프로파일을 자동으로 만들고 프로젝트에 적용한다.
        script: xcode-project use-profiles

      - name: 빌드 번호 증가
        # ★★★ **첫 빌드는 "이전 빌드가 없다"를 정상으로 다룬다.**
        #   get-latest-app-store-build-number 는 App Store Connect 에 그 앱의
        #   제출 이력이 하나도 없으면 실패할 수 있다(알려진 동작 — Codemagic
        #   CLI 문서·커뮤니티 다수 보고). 이 앱은 iOS 로는 **한 번도 낸 적이
        #   없다** — 그 실패가 뜨는 것이 확실하다. 실패를 설정 오류로 오인해
        #   막지 않고, **0 으로 폴백**해 첫 빌드가 1번을 받게 한다.
        #   Android 의 versionCode 오프셋 사고(§1.3)와 같은 종류의 함정이라
        #   미리 방어한다 — 여기서 안 막으면 이 스텝이 첫 실행에서 조용히
        #   전체 빌드를 죽인다.
        script: |
          cd $CM_BUILD_DIR/FE/ios/App
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo "0")
          if ! [[ "$LATEST_BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "⚠ get-latest-app-store-build-number 가 숫자가 아닌 값을 반환했다: '$LATEST_BUILD_NUMBER'"
            echo "  이전 제출 이력이 없는 첫 빌드로 보고 0 으로 폴백한다."
            LATEST_BUILD_NUMBER=0
          fi
          NEW_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          echo "이전 빌드 번호=$LATEST_BUILD_NUMBER → 이번 빌드 번호=$NEW_BUILD_NUMBER"
          agvtool new-version -all $NEW_BUILD_NUMBER

      - name: IPA 빌드
        script: |
          cd $CM_BUILD_DIR/FE/ios/App
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - FE/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      email:
        recipients:
          - 741u741@gmail.com
        notify:
          success: true
          failure: true

      app_store_connect:
        auth: integration
        # ★ 프로덕션이 아니라 TestFlight 다 — Android 가 alpha(비공개 테스트)
        #   로 가는 것과 같은 위치의 단계다. 심사 없이 내부 확인부터 한다.
        submit_to_testflight: true
