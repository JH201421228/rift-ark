apply plugin: 'com.android.application'

/**
 * ★★★ 릴리스 서명 (2026-08-08 · docs/06-release/50-google-play-paid-codemagic.md §1.3)
 *
 *   자격증명은 **두 곳**에서 올 수 있다:
 *     · CI  — Codemagic 이 `CM_*` 환경변수로 주입한다
 *     · 로컬 — `FE/android/key.properties` (★ `.gitignore` 대상. 평문 비밀번호다)
 *
 *   둘 다 없으면 **릴리스 서명을 아예 배선하지 않는다.** 그래야 키가 없는 사람도
 *   `assembleDebug` 를 돌릴 수 있고, 클론 직후 빌드가 "storeFile is null" 로
 *   죽지 않는다. 서명이 필요한 것은 `bundleRelease` 뿐이다.
 */
def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def hasCiKeystore = System.getenv("CM_KEYSTORE_PATH") as boolean
def canSignRelease = hasCiKeystore || keystorePropertiesFile.exists()

android {
    namespace "com.superdimension.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.superdimension.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        /**
         * ★★ `versionCode` 는 **한 번 올린 값보다 커야만** 업로드된다. 되돌릴 수 없다.
         *   CI 에서는 Codemagic 의 `BUILD_NUMBER`(단조 증가)를 그대로 쓴다.
         * ★ 숫자가 아닌 값이 들어오면 **빌드를 멈춘다.** 조용히 1 로 떨어지면
         *   이미 1 을 쓴 뒤에는 업로드가 거부되고, 원인이 CI 환경변수라는 것을
         *   알아내기까지 한참 걸린다.
         */
        versionCode = {
            def bn = System.getenv("BUILD_NUMBER")
            if (!bn) return 1
            if (!bn.isInteger()) {
                throw new GradleException("BUILD_NUMBER 가 정수가 아니다: '${bn}'")
            }
            return bn.toInteger()
        }()
        // ★ 스토어 표시용. 세 자리로 둔다 — 스토어 등록정보·릴리스 노트가 이 값을 쓴다
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasCiKeystore) {
                // ── CI (Codemagic 이 주입) ──
                storeFile     file(System.getenv("CM_KEYSTORE_PATH"))
                storePassword System.getenv("CM_KEYSTORE_PASSWORD")
                keyAlias      System.getenv("CM_KEY_ALIAS")
                keyPassword   System.getenv("CM_KEY_PASSWORD")
            } else if (keystorePropertiesFile.exists()) {
                // ── 로컬 (key.properties) ──
                // ★ 경로는 슬래시로 쓴다. Gradle 은 `\` 를 이스케이프로 읽어
                //   `C:\keys\...` 가 조용히 깨진다 (key.properties.example 참조)
                storeFile     file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias      keystoreProperties['keyAlias']
                /**
                 * ★ PKCS12 는 저장소 비밀번호 하나가 키까지 보호한다
                 *   ("Different store and key passwords not supported for PKCS12").
                 *   그래서 `keyPassword` 가 비어 있으면 `storePassword` 로 떨어진다 —
                 *   둘을 다르게 적는 실수가 "키를 못 연다"로 나타나는 것을 막는다.
                 */
                keyPassword   keystoreProperties['keyPassword'] ?: keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            /**
             * ★ 자격증명이 있을 때만 배선한다. 없으면 릴리스는 **서명되지 않은 채**
             *   만들어지고 그것으로 충분하다 — 스토어에 올리려는 사람만 키가 있으면 된다.
             *   여기서 무조건 `signingConfigs.release` 를 걸면 키 없는 환경의
             *   `assembleDebug` 까지 설정 단계에서 죽는다.
             */
            if (canSignRelease) {
                signingConfig signingConfigs.release
            }
            /**
             * ★★ `minifyEnabled` 를 켜지 않는다. Phaser 는 씬·플러그인을 문자열
             *   이름으로 찾고, Capacitor 플러그인은 리플렉션으로 불린다 — R8 이
             *   그것들을 지우면 **빌드는 성공하고 실행이 죽는다.** 켜려면
             *   `proguard-rules.pro` 에 keep 규칙을 먼저 쓰고 실기로 확인해야 한다.
             *   APK 가 큰 이유의 절반이 이것이다 (`50 §1.4`).
             */
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
