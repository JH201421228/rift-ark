# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
#
# ★★★ "Gradle build daemon disappeared unexpectedly" 는 **Gradle 힙 문제가 아니었다**
#   (2026-08-08). 처음에는 1536m 이 모자란 줄 알고 이 줄을 올렸는데, 올린 뒤에도
#   같은 자리에서 세 번 더 죽었다. `hs_err_pid*.log` 를 열자 원인이 다른 말을 했다:
#
#     Native memory allocation (malloc) failed to allocate 1187056 bytes
#     The system is out of physical RAM or swap space
#
#   힙(-Xmx)이 아니라 **시스템 커밋 한도**가 바닥나 있었다. 21시간 돌던
#   `npm run dev` 의 Vite 프로세스 하나가 **커밋 48GB** 를 잡고 있었고,
#   총 64.9GB 중 남은 것이 3.6GB 였다. 그것을 끄자 바로 통과했다.
#
#   ★ 그래서 **-Xmx 를 올리는 것이 이 증상을 악화시킨다.** 힙은 JVM 이 미리
#     커밋하는 양이라, 커밋이 부족한 상태에서 키우면 네이티브 arena 가 쓸 몫이
#     오히려 줄어든다. 같은 실수를 반복하지 않으려고 이 문단을 남긴다.
#
#   ★★ 증상이 다시 나오면 **`gradle.properties` 를 만지기 전에** 이것부터 본다:
#       Get-CimInstance Win32_OperatingSystem | Select FreeVirtualMemory
#       Get-Process | Sort PrivateMemorySize64 -Desc | Select -First 5 Name,PrivateMemorySize64
#     `FreeVirtualMemory` 가 몇 GB 밖에 없으면 범인은 Gradle 이 아니라 **다른 프로세스**다.
#
# 아래 값은 위 사고의 해결책이 아니라 **여유분**이다. AAB 리소스 처리는 APK 보다
# 메모리를 많이 쓰고 이 게임은 에셋이 크다 (디버그 APK 38MB). 1536m 으로도
# 되는지는 검증하지 않았다 — 되돌릴 이유가 없어서 검증하지 않았을 뿐이다.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

# When configured, Gradle will run in incubating parallel mode.
