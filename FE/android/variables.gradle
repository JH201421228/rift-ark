ext {
    minSdkVersion = 23
    /**
     * ★★★ **Play 는 매년 8월 말에 대상 API 를 올린다** (2026-08-08, Play Console 경고).
     *
     *   "2026년 8월 31일부터 최신 Android 출시로부터 1년 이내의 대상 API 수준을
     *    타겟팅하지 않는 경우 앱을 업데이트할 수 없습니다."
     *
     *   ⚠ **막히는 것은 신규 등록이 아니라 업데이트다.** 이미 올린 앱도 그날부터
     *     새 버전을 올릴 수 없다 — 버그를 고쳐도 배포할 방법이 없어진다.
     *     그래서 이것은 "나중에" 항목이 아니다.
     *
     *   ★ `compileSdk` 도 함께 올린다. 낮은 compileSdk 로 높은 target 을 선언하면
     *     새 API 를 컴파일 단계에서 볼 수 없고, AGP 가 경고 없이 통과시킨다.
     */
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.9.2'
    androidxAppCompatVersion = '1.7.0'
    androidxCoordinatorLayoutVersion = '1.2.0'
    androidxCoreVersion = '1.15.0'
    androidxFragmentVersion = '1.8.4'
    coreSplashScreenVersion = '1.0.1'
    androidxWebkitVersion = '1.12.1'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.2.1'
    androidxEspressoCoreVersion = '3.6.1'
    cordovaAndroidVersion = '10.1.1'
}